name: Video Builder

on:
  repository_dispatch:
    types: [generate-video]

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install ffmpeg (required by MoviePy)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run video generation
        id: generate
        working-directory: backend
        env:
          # Free-text fields must go through env vars (not shell args) so
          # prompts containing newlines or quotes don't break `/bin/sh`
          # argument parsing.
          TOPIC: ${{ github.event.client_payload.topic }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SEEDANCE_API_KEY: ${{ secrets.SEEDANCE_API_KEY }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: leoblixt25/Faceless_auto
        run: |
          python generate.py \
            --userId "${{ github.event.client_payload.userId }}" \
            --platform "${{ github.event.client_payload.platform }}" \
            --documentId "${{ github.event.client_payload.documentId }}" \
            --duration "${{ github.event.client_payload.duration || 30 }}"

      # Cleanup: if generation failed, flip the Firestore doc from
      # pending/processing to "failed" so videos don't hang at "processing".
      - name: Mark video failed (on generation failure)
        if: always() && steps.generate.outcome == 'failure'
        working-directory: backend
        env:
          DOCUMENT_ID: ${{ github.event.client_payload.documentId }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: python mark_failed.py
